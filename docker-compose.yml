version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: agentic_ai_crm_api
    ports:
      - "8000:8000"
    volumes:
      - crm_db_data:/app/backend
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    restart: unless-stopped
    networks:
      - governance_net

  ui:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    container_name: agentic_ai_crm_ui
    ports:
      - "8501:8501"
    environment:
      - API_BASE_URL=http://api:8000/api/v1
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - governance_net

volumes:
  crm_db_data:
    driver: local

networks:
  governance_net:
    driver: bridge
